<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/notARealGameDeVNoText.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/notARealGameDeVNoText.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/notARealGameDeVNoText.png" />
    <link rel="shortcut icon" href="images/notARealGameDeVNoText.png" />
    
    <title>· Eternal Coming-into-Being ·</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="twinkling-stars"></div>

    <div class="holo-card">
        <!-- Navigation -->
        <nav class="holo-nav">
            <a href="/" class="active">⌂ Home</a>
            <span class="nav-divider">✦</span>
            <a href="/AJR_EULA/">⚖ EULA</a>
            <span class="nav-divider">✦</span>
            <a href="https://www.youtube.com/@NotARealGameDev" target="_blank">▶ Watch</a>
        </nav>

        <!-- Logo -->
        <div class="logo-wrap">
            <img 
                src="images/notARealGameDeV.png" 
                alt="Game Dev Logo"
                class="logo-holo"
            />
        </div>

        <!-- Title -->
        <h1 class="title-glow">
            Enabling the Growth of Memorable Experiences through Infinite Games
        </h1>

        <!-- Subtitle -->
        <p class="sub-glow">
            ... And the creator of A Journey Rediscovered – Intro Version
        </p>

        <!-- Download Label -->
        <p class="download-label">
            🌐 Download games and enjoy your time:
        </p>

        <!-- Link -->
        <a 
            href="https://www.youtube.com/@NotARealGameDev" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="link-holo"
        >
            <img 
                src="images/AJRLogo.png" 
                alt="AJR Logo" 
                class="link-image"
                onerror="this.style.display='none'; this.parentElement.textContent='Test link';"
            />
            <span class="link-text">Test link</span>
        </a>

        <!-- Survey Divider -->
        <div class="survey-divider">
            <span class="divider-text">✦ Transmission ✦</span>
        </div>

        <!-- Survey -->
        <div class="survey-container">
            <textarea
                class="survey-input"
                id="surveyInput"
                rows="4"
                maxlength="2000"
                placeholder="✧ Align the telescopes... share your thoughts ✧"
            ></textarea>
            
            <div class="survey-footer">
                <div class="char-counter" id="charCounter">0 / 2000</div>
                <button class="submit-btn" id="submitBtn" disabled>✦ Submit</button>
            </div>
        </div>

        <div class="decorative-line"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
